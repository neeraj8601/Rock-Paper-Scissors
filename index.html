<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <h1 class="heading">Rock Paper Scissors</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="Screenshot 2026-06-26 220508.jpg" alt="">
        </div>
        <div class="choice" id="paper">
            <img src="Screenshot 2026-06-26 220535.jpg" alt="">
        </div>
        <div class="choice" id="scissors">
            <img src="Screenshot 2026-06-26 220149.jpg" alt="">
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p class="p" id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p class="p" id="comp-score">0</p>
            <p>Comp</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">Pick your move</p>
    </div>


    <Script src="Script.js"></Script>
</body>
</html>
